<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شير ستور | SHARE STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --whatsapp: #25D366;
      --telegram: #0088CC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 60px;
    }

    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 24px;
      color: var(--primary);
    }

    .logo-text {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    .btn-add-product {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-add-product:hover {
      background-color: var(--primary-hover);
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .disclaimer {
      background-color: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #E2E8F0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: white;
      font-size: 1rem;
      outline: none;
      margin-bottom: 25px;
    }

    .search-bar:focus {
      border-color: var(--primary);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .product-price {
      color: #4ADE80;
      font-weight: bold;
      font-size: 1.1rem;
      white-space: nowrap;
    }

    .seller-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .product-desc {
      font-size: 0.9rem;
      color: #CBD5E1;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
      text-align: center;
      font-size: 0.85rem;
      font-weight: bold;
      display: block;
    }

    .btn-wa { background-color: var(--whatsapp); }
    .btn-tg { background-color: var(--telegram); }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 100;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      border: 1px solid var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-submit {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-cancel {
      background: #475569;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">♾️</div>
      <div class="logo-text">شير ستور | SHARE STORE</div>
    </div>
    <button class="btn-add-product" onclick="openModal()">+ أضف إعلانك</button>
  </header>

  <div class="container">
    <div class="disclaimer">
      <span>⚠️</span>
      <span><strong>تنبيه:</strong> المنصة مجرد وسيط إعلاني لعرض الخدمات. التعامل المالي والتسليم يقع على المسؤولية الشخصية للطرفين.</span>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="ابحث عن اشتراك، لعبة، أو خدمة..." onkeyup="filterProducts()">

    <div class="products-grid" id="productsList">
      <!-- المنتجات تظهر هنا تلقائياً -->
    </div>
  </div>

  <!-- Modal إضافة منتج -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px;">إضافة خدمة / منتج جديد</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="form-group">
          <label>اسم الخدمة / المنتج *</label>
          <input type="text" id="pTitle" required placeholder="مثال: يوتيوب بريميوم سنة">
        </div>
        <div class="form-group">
          <label>السعر (مع العملة) *</label>
          <input type="text" id="pPrice" required placeholder="مثال: 60 ريال">
        </div>
        <div class="form-group">
          <label>اسم المتجر / البائع *</label>
          <input type="text" id="pSeller" required placeholder="مثال: متجر السعادة">
        </div>
        <div class="form-group">
          <label>رقم الواتساب (بالصيغة الدولية) *</label>
          <input type="text" id="pWhatsapp" required placeholder="9665xxxxxxxx">
        </div>
        <div class="form-group">
          <label>يوزر التيليجرام (بدون @ - اختياري)</label>
          <input type="text" id="pTelegram" placeholder="username">
        </div>
        <div class="form-group">
          <label>الوصف والشروط *</label>
          <textarea id="pDesc" rows="2" required placeholder="تفاصيل الحساب أو مدة الضمان"></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-submit">نشر الإعلان</button>
          <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let products = JSON.parse(localStorage.getItem('sharestore_products')) || [
      {
        title: "اشتراك يوتيوب بريميوم 12 شهر",
        price: "60 ريال",
        seller: "متجر الأسطورة",
        whatsapp: "966500000000",
        telegram: "legend_store",
        desc: "حساب رسمي مفعل بالكامل، ضمان كامل المدة، تسليم فوري."
      },
      {
        title: "شحن شدات ببجي 660 UC",
        price: "42 ريال",
        seller: "فهد الرقمي",
        whatsapp: "966511111111",
        telegram: "",
        desc: "شحن مباشر عبر الأيدي ID خلال 5 دقائق فقط."
      }
    ];

    function renderProducts(list) {
      const container = document.getElementById('productsList');
      container.innerHTML = '';
      list.forEach((p) => {
        const msg = encodeURIComponent(`مرحباً، أود شراء: ${p.title} المعروض في شير ستور`);
        const waLink = `https://wa.me/${p.whatsapp}?text=${msg}`;
        const tgBtn = p.telegram ? `<a href="https://t.me/${p.telegram}" target="_blank" class="btn-action btn-tg">تيليجرام</a>` : '';

        container.innerHTML += `
          <div class="card">
            <div>
              <div class="card-header">
                <div class="product-title">${p.title}</div>
                <div class="product-price">${p.price}</div>
              </div>
              <div class="seller-info">البائع: ${p.seller}</div>
              <div class="product-desc">${p.desc}</div>
            </div>
            <div class="action-buttons">
              <a href="${waLink}" target="_blank" class="btn-action btn-wa">واتساب</a>
              ${tgBtn}
            </div>
          </div>
        `;
      });
    }

    function openModal() { document.getElementById('productModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('productModal').style.display = 'none'; }

    function saveProduct(e) {
      e.preventDefault();
      const newP = {
        title: document.getElementById('pTitle').value,
        price: document.getElementById('pPrice').value,
        seller: document.getElementById('pSeller').value,
        whatsapp: document.getElementById('pWhatsapp').value.replace('+', '').trim(),
        telegram: document.getElementById('pTelegram').value.replace('@', '').trim(),
        desc: document.getElementById('pDesc').value
      };
      products.unshift(newP);
      localStorage.setItem('sharestore_products', JSON.stringify(products));
      renderProducts(products);
      closeModal();
      document.getElementById('productForm').reset();
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    renderProducts(products);
  </script>
</body>
</html>
